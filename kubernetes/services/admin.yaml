apiVersion: v1
kind: Service
metadata:
  name: admin
  labels:
    app: admin
    app.kubernetes.io/component: admin-studio
spec:
  # ClusterIP only — public entry is the NGINX Ingress LoadBalancer (one LB for the lab).
  type: ClusterIP
  selector:
    app: admin
  ports:
    - name: http
      port: 3000
      targetPort: http
