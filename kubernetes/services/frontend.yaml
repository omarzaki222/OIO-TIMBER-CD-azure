apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/component: customer-site
spec:
  # ClusterIP only — public entry is the NGINX Ingress LoadBalancer (one LB for the lab).
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
