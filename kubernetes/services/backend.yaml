apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/component: api
spec:
  # ClusterIP only — public entry is the NGINX Ingress LoadBalancer (one LB for the lab).
  # Application Ingress routes (/ /api /admin) are added in a later step.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
