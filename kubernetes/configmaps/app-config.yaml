# Non-secret runtime configuration for the OIO backend (Azure lab).
# CORS origins must match the browser origins of the frontend and admin Ingress hosts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oio-app-config
  labels:
    app.kubernetes.io/component: backend
data:
  APP_ENV: production
  WEB_CONCURRENCY: "2"
  RUN_SEED: "false"
  # Browser origins for app. + admin. hosts (credentials: include on API calls).
  CORS_ALLOWED_ORIGINS: "http://app.20.127.183.78.nip.io,http://admin.20.127.183.78.nip.io"
