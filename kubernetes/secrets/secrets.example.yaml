# TEMPLATE ONLY — do not apply with placeholder values.
# Create real secrets before deploy, e.g.:
#
#   kubectl -n oio-wood-timber create secret generic oio-postgres \
#     --from-literal=POSTGRES_DB=oio \
#     --from-literal=POSTGRES_USER=oio \
#     --from-literal=POSTGRES_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
#
#   kubectl -n oio-wood-timber create secret generic oio-app-secrets \
#     --from-literal=JWT_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=DATABASE_URL="postgresql+psycopg://oio:REPLACE@postgres:5432/oio"
#
# This file is NOT referenced by kustomization.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: oio-postgres
  namespace: oio-wood-timber
type: Opaque
stringData:
  POSTGRES_DB: oio
  POSTGRES_USER: oio
  POSTGRES_PASSWORD: REPLACE-me-before-apply
---
apiVersion: v1
kind: Secret
metadata:
  name: oio-app-secrets
  namespace: oio-wood-timber
type: Opaque
stringData:
  JWT_SECRET: REPLACE-me-before-apply
  DATABASE_URL: postgresql+psycopg://oio:REPLACE@postgres:5432/oio
