# OIO admin studio — host-based routing via existing F5 NGINX Ingress.
# Service remains ClusterIP (admin:3000). No path rewrite:
# Next.js admin owns "/" (e.g. /login); a shared-host /admin prefix would
# break those routes without a rewrite. Separate host matches CORS origins.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oio-admin
  labels:
    app.kubernetes.io/part-of: oio-wood-timber
    app.kubernetes.io/component: ingress
spec:
  ingressClassName: nginx
  rules:
    - host: admin.20.127.183.78.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3000
