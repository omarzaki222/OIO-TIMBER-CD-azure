# Azure AKS environment overlay
#
# Images: oioazureregistry.azurecr.io/oio/{backend,frontend,admin}:<tag>
# CI updates newTag values and pushes this overlay to OIO-TIMBER-CD-azure.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../kubernetes

images:
  - name: oio-backend
    newName: oioazureregistry.azurecr.io/oio/backend
    newTag: "3-74b8d88"
  - name: oio-frontend
    newName: oioazureregistry.azurecr.io/oio/frontend
    newTag: "3-74b8d88"
  - name: oio-admin
    newName: oioazureregistry.azurecr.io/oio/admin
    newTag: "3-74b8d88"
